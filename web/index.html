            </div>

            <!-- Media / Game Selector -->
            <div class="toolbar-group">
                <select id="game-select" class="btn-select">
                    <option value="games/mz_runner.mzf" selected>★ MZ-RUNNER (Arcade Game)</option>
                    <option value="games/unicard_mgr.mzf">Unicard Manager (MZ-800)</option>
                </select>
                <button id="btn-load-game" class="btn">▶ Run</button>
                <input type="file" id="file-input" accept=".mzf,.m12,.dsk" style="display:none">
                <button class="btn" onclick="document.getElementById('file-input').click()">📂 Tape (.mzf)</button>
            </div>

            <!-- Emulator Actions -->
            <div class="toolbar-group">
                <button id="btn-reset" class="btn">🔄 Reset</button>
                <button id="btn-speed" class="btn">Speed: 1x</button>
                <button id="btn-mute" class="btn">Sound: ON</button>
                <button id="btn-aspect" class="btn" title="Toggle Aspect Ratio (4:3 CRT / 4:3 Zoom / 1:1 Pixel / Stretch)">📺 4:3 CRT</button>
                <button id="btn-crt" class="btn active" title="Toggle Scanline Filter">CRT</button>
                <button id="btn-gamepad" class="btn" title="Toggle On-screen Touch Gamepad">🎮 Pad</button>
                <button id="btn-fullscreen" class="btn" title="Toggle Fullscreen">⛶ Fullscreen</button>
            </div>
        </header>

        <!-- CRT Display Screen -->
        <main id="screen-viewport">
            <!-- Status overlay badge -->
            <div id="status-overlay">
                <div class="status-item">
                    <span id="stat-audio" class="status-dot"></span>
                    <span>AUDIO</span>
                </div>
                <div class="status-item">
                    <span id="stat-fps">-- FPS</span>
                </div>
                <div class="status-item">
                    <span id="stat-tape" style="color:#24ccff;">Ready</span>
                </div>
            </div>

            <div class="crt-container crt-scanlines">
                <canvas id="mz-canvas" width="928" height="288"></canvas>
            </div>
        </main>

        <!-- Responsive Touch / Virtual Controller -->
        <footer id="touch-controller">
            <!-- D-Pad (Left Thumb) -->
            <div class="dpad-container">
                <button id="btn-up" class="dpad-btn dpad-up" aria-label="Up">▲</button>
                <button id="btn-left" class="dpad-btn dpad-left" aria-label="Left">◀</button>
                <div class="dpad-center"></div>
                <button id="btn-right" class="dpad-btn dpad-right" aria-label="Right">▶</button>
                <button id="btn-down" class="dpad-btn dpad-down" aria-label="Down">▼</button>
            </div>

            <!-- Auxiliary System Buttons (Center) -->
            <div class="sys-keys-container">
                <div class="sys-keys-row">
                    <button id="btn-sys-break" class="sys-btn break-btn" aria-label="Break">BREAK</button>
                    <button id="btn-sys-cr" class="sys-btn" aria-label="Return / CR">CR / ENTER</button>
                </div>
                <button id="btn-sys-space" class="sys-btn sys-btn-wide" aria-label="Spacebar">SPACE</button>
            </div>

            <!-- Action Buttons (Right Thumb) -->
            <div class="action-buttons-container">
                <button id="btn-act-c" class="act-btn act-btn-c" aria-label="Shift">
                    <span>C</span>
                    <span class="label">SHIFT</span>
                </button>
                <button id="btn-act-b" class="act-btn act-btn-b" aria-label="Fire 2 / Up">
                    <span>B</span>
                    <span class="label">UP</span>
                </button>
                <button id="btn-act-a" class="act-btn act-btn-a" aria-label="Fire 1 / Space">
                    <span>A</span>
                    <span class="label">FIRE</span>
                </button>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="mz800.js"></script>
    <script src="controls.js"></script>
    <script src="emulator.js"></script>
</body>
</html>
