<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #333; }
  #toolbar { height: 40px; background: #444; }
  #screen-viewport {
      flex: 1;
      min-width: 0; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      background: #111; padding: 6px;
  }
  .crt-container {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      background-color: #000;
      aspect-ratio: 4 / 3;
      max-width: 100%; max-height: 100%;
      border: 2px solid red; /* To see its bounds */
  }
  .crt-scanlines::after {
      content: " ";
      position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 255, 255, 0.5) 50%);
      background-size: 100% 4px;
      pointer-events: none;
  }
  #mz-canvas {
      width: 100%; height: 100%;
      object-fit: fill;
      background-color: #000;
      border: 1px solid blue;
  }
  #gamepad { height: 180px; background: #222; }
</style>
</head>
<body>
  <div id="toolbar"></div>
  <div id="screen-viewport">
    <div class="crt-container crt-scanlines">
      <canvas id="mz-canvas" width="928" height="288"></canvas>
    </div>
  </div>
  <div id="gamepad"></div>
  <script>
    function updateDisplaySize() {
        const viewport = document.getElementById('screen-viewport');
        const container = document.querySelector('.crt-container');
        const availW = viewport.clientWidth - 12;
        const availH = viewport.clientHeight - 12;
        let targetRatio = 4 / 3;
        let dispW, dispH;
        if (availW / availH > targetRatio) {
            dispH = availH;
            dispW = Math.round(dispH * targetRatio);
        } else {
            dispW = availW;
            dispH = Math.round(dispW / targetRatio);
        }
        container.style.width = `${dispW}px`;
        container.style.height = `${dispH}px`;
        console.log(`avail: ${availW}x${availH}, disp: ${dispW}x${dispH}`);
    }
    updateDisplaySize();
    window.addEventListener('resize', updateDisplaySize);
  </script>
</body>
</html>
